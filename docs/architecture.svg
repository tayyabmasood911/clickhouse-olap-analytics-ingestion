<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; fill: #64748b; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .node-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #0284c7; }
      .solid-arrow { stroke: #0284c7; stroke-width: 2; fill: none; }
      .kafka-arrow { stroke: #e11d48; stroke-width: 2; fill: none; }
      .mv-arrow { stroke: #0d9488; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
    </marker>
  </defs>

  <!-- Header Section -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="1080" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="30" y="32" class="title">ClickHouse OLAP Ingestion &amp; Materialized Pipeline Blueprint</text>
    <text x="30" y="52" class="subtitle">Kafka Engine Ingestion, Materialized View Streams, Partitioned MergeTree Storage &amp; SummingMergeTree Aggregation</text>
    <rect x="910" y="22" width="140" height="26" rx="13" fill="#f59e0b"/>
    <text x="980" y="39" text-anchor="middle" class="badge-text" style="fill: #78350f;">100K+ RPS OLAP</text>
  </g>

  <!-- 1. Producer & Ingestion Sources -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="230" height="500" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="20" y="30" class="group-title">1. Event Producers</text>

    <!-- Async Python Load Engine -->
    <g transform="translate(15, 55)">
      <rect width="200" height="120" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="10" fill="#e0f2fe"/>
      <path d="M 21 27 L 25 18 L 29 27 Z" fill="#0284c7"/>
      <text x="45" y="24" class="node-title">Python Async Engine</text>
      <text x="45" y="38" class="node-desc">asyncio / HTTP Ingest</text>
      <text x="15" y="65" class="node-desc">• 250 records/batch JSON</text>
      <text x="15" y="82" class="node-desc">• Concurrent worker pools</text>
      <text x="15" y="102" class="node-tag">Direct HTTP POST :8123</text>
    </g>

    <!-- Edge Telemetry Services -->
    <g transform="translate(15, 190)">
      <rect width="200" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="10" fill="#e0f2fe"/>
      <rect x="21" y="21" width="8" height="8" fill="#0284c7"/>
      <text x="45" y="24" class="node-title">Microservices APM</text>
      <text x="45" y="38" class="node-desc">Kafka Producers</text>
      <text x="15" y="65" class="node-desc">• High-speed clickstream</text>
      <text x="15" y="82" class="node-desc">• Network &amp; host telemetry</text>
      <text x="15" y="102" class="node-tag">Publishes to Kafka broker</text>
    </g>

    <!-- Kafka Event Stream Box -->
    <g transform="translate(15, 325)">
      <rect width="200" height="150" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
      <rect x="15" y="15" width="24" height="24" rx="4" fill="#ffe4e6"/>
      <text x="27" y="32" text-anchor="middle" style="font-family: sans-serif; font-size: 11px; font-weight:bold; fill:#e11d48;">K</text>
      <text x="48" y="24" class="node-title">Kafka / Redpanda</text>
      <text x="48" y="38" class="node-desc">telemetry_stream</text>
      <text x="15" y="65" class="node-desc">• JSONEachRow serialization</text>
      <text x="15" y="82" class="node-desc">• 6 Partitions / Consumer Group</text>
      <text x="15" y="100" class="node-desc">• Guaranteed ordered delivery</text>
      <text x="15" y="125" class="node-tag" style="fill:#e11d48;">Broker Port: 9092</text>
    </g>
  </g>

  <!-- Arrow: Producers -> ClickHouse -->
  <path d="M 290 400 L 340 400" class="kafka-arrow" marker-end="url(#arrow-red)"/>

  <!-- 2. ClickHouse Ingestion Engines & Materialized Views -->
  <g transform="translate(340, 140)">
    <rect x="0" y="0" width="370" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="25" y="30" class="group-title">2. Ingestion &amp; Stream Pipeline</text>

    <!-- Kafka Engine Table -->
    <g transform="translate(20, 55)">
      <rect width="330" height="115" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#ffe4e6"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 12px; font-weight:bold; fill:#be123c;">KE</text>
      <text x="50" y="26" class="node-title">kafka_telemetry_queue (ENGINE=Kafka)</text>
      <text x="50" y="40" class="node-tag" style="fill:#be123c;">VIRTUAL BUFFER CONSUMER</text>
      <text x="15" y="68" class="node-desc">• 2 Parallel consumer threads • Block: 65,536</text>
      <text x="15" y="86" class="node-desc">• Zero permanent storage (data transiently consumed)</text>
      <text x="15" y="103" class="node-desc">• Group: clickhouse_analytics_consumer</text>
    </g>

    <!-- Arrow: Kafka Engine -> MV 1 -->
    <path d="M 185 170 L 185 210" class="solid-arrow" marker-end="url(#arrow)"/>

    <!-- Materialized View 1 -->
    <g transform="translate(20, 215)">
      <rect width="330" height="115" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#ccfbf1"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 12px; font-weight:bold; fill:#0d9488;">MV</text>
      <text x="50" y="26" class="node-title">mv_kafka_to_telemetry (Materialized View)</text>
      <text x="50" y="40" class="node-tag" style="fill:#0d9488;">STREAM TRANSFORMATION</text>
      <text x="15" y="68" class="node-desc">• Parses DateTime64 timestamps &amp; UUID formats</text>
      <text x="15" y="86" class="node-desc">• Filters corrupted rows (WHERE event_time IS NOT NULL)</text>
      <text x="15" y="103" class="node-desc">• Pipes data directly to base MergeTree table</text>
    </g>

    <!-- Arrow: Base Table -> MV 2 -->
    <path d="M 185 330 L 185 365" class="mv-arrow" marker-end="url(#arrow-teal)"/>

    <!-- Materialized View 2: Aggregator -->
    <g transform="translate(20, 370)">
      <rect width="330" height="110" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#ede9fe"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 12px; font-weight:bold; fill:#6366f1;">RO</text>
      <text x="50" y="26" class="node-title">mv_telemetry_hourly_rollup</text>
      <text x="50" y="40" class="node-tag" style="fill:#6366f1;">CONTINUOUS ROLLUP ENGINE</text>
      <text x="15" y="68" class="node-desc">• Computes count(), sum(latency), error_count</text>
      <text x="15" y="86" class="node-desc">• Triggers on every incoming insert transaction</text>
      <text x="15" y="103" class="node-desc">• Feeds hourly SummingMergeTree storage</text>
    </g>
  </g>

  <!-- Connectors: Pipeline -> Physical Tables -->
  <path d="M 710 270 L 760 210" class="solid-arrow" marker-end="url(#arrow)"/>
  <path d="M 710 425 L 760 425" class="solid-arrow" marker-end="url(#arrow)"/>

  <!-- 3. Physical Storage Tables & Analytical Queries -->
  <g transform="translate(760, 140)">
    <rect x="0" y="0" width="380" height="500" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="25" y="30" class="group-title">3. Physical Storage &amp; Analytics</text>

    <!-- Base MergeTree Table -->
    <g transform="translate(20, 55)">
      <rect width="340" height="175" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#e0f2fe"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 11px; font-weight:bold; fill:#0284c7;">MT</text>
      <text x="50" y="26" class="node-title">telemetry_events (MergeTree)</text>
      <text x="50" y="40" class="node-tag">PRIMARY RAW OLAP TABLE</text>
      <text x="15" y="68" class="node-desc">• <b>PARTITION BY:</b> toYYYYMM(event_date)</text>
      <text x="15" y="86" class="node-desc">• <b>ORDER BY:</b> (tenant_id, event_type, hour, device_id)</text>
      <text x="15" y="104" class="node-desc">• <b>CODEC:</b> payload String CODEC(ZSTD(3))</text>
      <text x="15" y="122" class="node-desc">• Sparse Index Granularity = 8192</text>
      <text x="15" y="140" class="node-desc">• Parallel background part merges &amp; pruning</text>
      <text x="15" y="162" class="node-tag">Sub-millisecond single-device range scans</text>
    </g>

    <!-- SummingMergeTree Rollup Table -->
    <g transform="translate(20, 245)">
      <rect width="340" height="145" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#ede9fe"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 11px; font-weight:bold; fill:#6366f1;">SM</text>
      <text x="50" y="26" class="node-title">telemetry_hourly_rollup (Summing)</text>
      <text x="50" y="40" class="node-tag" style="fill:#6366f1;">PRE-AGGREGATED ANALYTICS</text>
      <text x="15" y="68" class="node-desc">• Automatically collapses rows sharing same key</text>
      <text x="15" y="86" class="node-desc">• Instant multi-month trendline calculations</text>
      <text x="15" y="104" class="node-desc">• 1000x faster than full table scans</text>
      <text x="15" y="130" class="node-tag">Powers Executive KPI Dashboards</text>
    </g>

    <!-- Egress Analytics Clients -->
    <g transform="translate(20, 405)">
      <rect width="340" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="24" class="node-title">Analytical Consumers</text>
      <text x="15" y="45" class="node-desc">Grafana Dashboards • Apache Superset • BI SQL Queries</text>
      <text x="15" y="63" class="node-tag">HTTP Interface :8123 • Native TCP :9000</text>
    </g>
  </g>
</svg>

version: '3.8'

services:
  # ClickHouse High-Performance Analytical Database
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse-olap
    restart: unless-stopped
    ports:
      - "8123:8123" # HTTP API
      - "9000:9000" # Native Client
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    environment:
      - CLICKHOUSE_DB=analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Kafka / Redpanda Lightweight Event Broker
  kafka:
    image: redpandadata/redpanda:v23.3.10
    container_name: kafka-telemetry-broker
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9644:9644"
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://kafka:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data

volumes:
  clickhouse-data:
  redpanda-data:
